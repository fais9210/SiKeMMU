<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <!-- Decorative Islamic Geometric Star Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
  
  <!-- Mosque Dome Silhouette -->
  <path d="M 256 120 C 275 160 330 200 330 270 L 182 270 C 182 200 237 160 256 120 Z" fill="url(#emeraldGrad)" opacity="0.95"/>
  <!-- Dome Crescent and Star Pin -->
  <path d="M 256 95 L 256 120 M 256 90 A 10 10 0 1 0 256 110 A 8 8 0 1 1 256 94" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"/>

  <!-- Accounting Ledger / Cashbook / Shield Base -->
  <rect x="156" y="270" width="200" height="130" rx="16" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6"/>
  <!-- Ledger lines -->
  <line x1="186" y1="305" x2="326" y2="305" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <line x1="186" y1="335" x2="280" y2="335" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="186" y1="365" x2="310" y2="365" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <!-- Rupiah / Coin Emblem badge -->
  <circle cx="346" cy="360" r="40" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
  <text x="346" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#022c22" text-anchor="middle">Rp</text>
</svg>
